<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contexto Político | Artículo</title>

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:title" content="Contexto Político | Noticias e Investigación">
    <meta property="og:description" content="Periodismo político de investigación. Análisis geopolítico, asuntos legislativos y política internacional.">
    <meta property="og:image" content="https://revistaizquierda.com/wp-content/uploads/2025/04/portada-Marx-profeta-del-decrecimiento-1024x605.png">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://contextos-politicos.vercel.app/articulo.html">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contexto Político | Noticias e Investigación">
    <meta name="twitter:description" content="Periodismo político de investigación. Análisis geopolítico, asuntos legislativos y política internacional.">
    <meta name="twitter:image" content="https://www.clarin.com/img/2013/12/05/BJhTdHgNx_1256x620.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --guardian-navy: #052962;
            --guardian-blue: #005689;
            --guardian-accent: #00b2ff;
            --guardian-yellow: #ffe500;
            --guardian-red: #c70000;
            --guardian-dark: #121212;
            --guardian-bg: #f6f6f6;
            --guardian-line: #dcdcdc;
            --blanco: #ffffff;
            --fuente-titulo: 'Merriweather', Georgia, serif;
            --fuente-sans: 'Public Sans', -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--fuente-sans); background-color: var(--guardian-bg); color: var(--guardian-dark); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; height: auto; display: block; }
        .container { max-width: 740px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--guardian-navy); color: var(--blanco); border-bottom: 3px solid var(--guardian-yellow); }
        .header-main { padding: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-family: var(--fuente-titulo); font-size: 2rem; font-weight: 900; color: var(--blanco); }
        .site-title span { color: var(--guardian-accent); }
        .back-link { color: var(--guardian-yellow); font-weight: 700; font-size: 0.9rem; border: 1px solid var(--guardian-yellow); padding: 6px 14px; border-radius: 2px; }
        .back-link:hover { background: var(--guardian-yellow); color: var(--guardian-navy); }

        .article-header { margin: 40px 0 20px; }
        .article-kicker { color: var(--guardian-red); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .article-title { font-family: var(--fuente-titulo); font-size: 2.4rem; font-weight: 900; line-height: 1.1; color: var(--guardian-navy); margin-bottom: 15px; }
        .article-subtitle { font-size: 1.15rem; color: #444; line-height: 1.4; margin-bottom: 20px; font-weight: 400; }
        .article-meta { font-size: 0.85rem; color: #666; border-bottom: 1px solid var(--guardian-line); padding-bottom: 15px; margin-bottom: 25px; }
        .article-meta strong { color: var(--guardian-dark); }

        .article-figure { margin: 0 0 30px; }
        .article-figure img { width: 100%; border-radius: 2px; }
        .article-figure figcaption { font-size: 0.8rem; color: #555; padding-top: 8px; border-top: 2px solid var(--guardian-blue); margin-top: 8px; }

        .share-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0 0 30px; padding: 14px 0; border-top: 1px solid var(--guardian-line); border-bottom: 1px solid var(--guardian-line); }
        .share-label { font-size: 0.8rem; font-weight: 800; color: #555; text-transform: uppercase; margin-right: 4px; }
        .social-link { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 2px; color: #fff; font-family: var(--fuente-sans); font-size: 0.82rem; font-weight: 900; }
        .social-link:hover { opacity: 0.82; }
        .social-facebook { background: #1877f2; }
        .social-x { background: #111; }
        .social-linkedin { background: #0a66c2; }
        .social-whatsapp { background: #25d366; }

        .article-body { font-family: var(--fuente-titulo); font-size: 1.1rem; line-height: 1.8; color: #222; }
        .article-body p { margin-bottom: 1.2em; }
        .article-body h3 { font-family: var(--fuente-sans); font-size: 1.3rem; font-weight: 800; margin: 1.5em 0 0.6em; color: var(--guardian-navy); }
        .article-tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 25px; }
        .article-tag { color: var(--guardian-blue); font-size: 0.82rem; font-weight: 800; }
        .article-ad { display: flex; justify-content: center; align-items: center; background: #fff; padding: 18px; margin: 28px 0; border: 1px solid var(--guardian-line); }
        .article-ad img { width: 150px; }
        .comments-section { margin-top: 40px; padding-top: 22px; border-top: 2px solid var(--guardian-navy); }
        .comments-section h2 { font-family: var(--fuente-titulo); color: var(--guardian-navy); margin-bottom: 15px; }
        .comment-form { display: grid; gap: 10px; margin-bottom: 25px; }
        .comment-form input, .comment-form textarea { width: 100%; padding: 10px; border: 1px solid var(--guardian-line); font: inherit; }
        .comment-form textarea { min-height: 110px; resize: vertical; }
        .comment-submit { width: fit-content; padding: 10px 15px; border: 0; background: var(--guardian-navy); color: #fff; font-weight: 800; cursor: pointer; }
        .comment-status { color: #555; font-size: 0.9rem; }
        .comment-item { padding: 13px 0; border-top: 1px solid var(--guardian-line); }
        .comment-item strong { color: var(--guardian-navy); }
        .comment-item p { margin: 4px 0 0; white-space: pre-wrap; }

        .not-found { text-align: center; padding: 100px 20px; }
        .not-found h2 { font-family: var(--fuente-titulo); font-size: 2rem; color: var(--guardian-navy); margin-bottom: 15px; }

        footer { background-color: var(--guardian-navy); color: var(--blanco); padding: 30px 0; margin-top: 60px; border-top: 4px solid var(--guardian-yellow); text-align: center; font-size: 0.85rem; color: #a0c4e8; }

        @media (max-width: 600px) {
            .article-title { font-size: 1.7rem; }
            .container { padding: 0 15px; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <header>
        <div class="container" style="max-width: 1300px;">
            <div class="header-main">
                <a href="index.html" class="site-title">Contexto <span>Político</span></a>
                <a href="index.html" class="back-link">← Volver al inicio</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" id="article-container">
            <div class="not-found"><h2>Cargando artículo...</h2></div>
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 Contexto Político — Periodismo Político de Investigación
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const DATA_URL = "https://raw.githubusercontent.com/Alvarorfontana/contextos.politicos/main/data.json";
        const supabaseClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);

        function getParam(name) {
            return new URL(window.location.href).searchParams.get(name);
        }

        async function getArticles() {
            try {
                const { data, error } = await supabaseClient.from('articles').select('*');
                if (!error && data && data.length > 0) return data;
                const res = await fetch(DATA_URL);
                if (!res.ok) throw new Error("No se pudo cargar");
                return await res.json();
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        function formatArticleContent(content) {
            if (!content) return '';
            if (/<[a-z][\s\S]*>/i.test(content)) return content;

            return content
                .trim()
                .split(/\n\s*\n/)
                .map(paragraph => `<p>${paragraph.trim().replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function escapeHtml(value = '') {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function loadComments(articleId) {
            const list = document.getElementById('comments-list');
            const { data, error } = await supabaseClient.from('comments').select('name,body,created_at').eq('article_id', articleId).eq('approved', true).order('created_at', { ascending: false });
            if (error) {
                list.textContent = 'Los comentarios estarán disponibles próximamente.';
                return;
            }
            list.innerHTML = data.length ? data.map(comment => `<div class="comment-item"><strong>${escapeHtml(comment.name)}</strong><p>${escapeHtml(comment.body)}</p></div>`).join('') : '<p class="comment-status">Todavía no hay comentarios aprobados.</p>';
        }

            function updateSocialMeta(article) {
                const description = article.subtitle || 'Leé el análisis completo en Contexto Político.';
                const image = article.image || 'https://revistaizquierda.com/wp-content/uploads/2025/04/portada-Marx-profeta-del-decrecimiento-1024x605.png';
                const articleUrl = window.location.href.split('#')[0];
                document.title = `${article.title} | Contexto Político`;
                document.querySelector('meta[property="og:title"]').setAttribute('content', article.title);
                document.querySelector('meta[property="og:description"]').setAttribute('content', description);
                document.querySelector('meta[property="og:image"]').setAttribute('content', image);
                document.querySelector('meta[property="og:url"]').setAttribute('content', articleUrl);
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', article.title);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
                document.querySelector('meta[name="twitter:image"]').setAttribute('content', image);
                const keywords = (article.tags || '').split(',').map(tag => tag.trim()).filter(Boolean).join(', ');
                let keywordsMeta = document.querySelector('meta[name="keywords"]');
                if (!keywordsMeta) {
                    keywordsMeta = document.createElement('meta');
                    keywordsMeta.setAttribute('name', 'keywords');
                    document.head.appendChild(keywordsMeta);
                }
                keywordsMeta.setAttribute('content', keywords);
            }

        async function renderArticle() {
            const id = getParam('id');
            const container = document.getElementById('article-container');
            const articles = await getArticles();
            const article = articles.find(a => a.id === id);

            if (!article) {
                container.innerHTML = `
                    <div class="not-found">
                        <h2>Artículo no encontrado</h2>
                        <p>La noticia que buscás no existe o fue eliminada.</p>
                        <br>
                        <a href="index.html" style="color: var(--guardian-blue); font-weight: 700;">Volver a la portada</a>
                    </div>
                `;
                document.title = "No encontrado | Contexto Político";
                return;
            }

            document.title = article.title + " | Contexto Político";
            updateSocialMeta(article);
            const tagsBlock = article.tags ? `
                <div class="article-tags" aria-label="Hashtags">
                    ${article.tags.split(',').map(tag => tag.trim()).filter(Boolean).map(tag => `<span class="article-tag">#${tag.replace(/^#/, '')}</span>`).join('')}
                </div>
            ` : '';
            const shareTags = article.tags ? article.tags.split(',').map(tag => '#' + tag.trim().replace(/^#/, '')).filter(tag => tag !== '#').join(' ') : '';

            const imgBlock = article.image ? `
                <figure class="article-figure">
                    <img src="${article.image}" alt="${article.title}">
                    <figcaption>${article.caption || 'Imagen ilustrativa del artículo.'}</figcaption>
                </figure>
            ` : '';

            container.innerHTML = `
                <div class="article-header">
                    <span class="article-kicker">${article.kicker}</span>
                    <h1 class="article-title">${article.title}</h1>
                    <p class="article-subtitle">${article.subtitle}</p>
                    <div class="article-meta">
                        Por <strong>${article.author}</strong> &nbsp;|&nbsp; ${new Date(article.date).toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric'})}
                    </div>
                </div>
                ${imgBlock}
                ${tagsBlock}
                <div class="share-row" aria-label="Compartir artículo">
                    <span class="share-label">Compartir</span>
                    <a class="social-link social-facebook" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" aria-label="Compartir en Facebook">f</a>
                    <a class="social-link social-x" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(article.title)}" aria-label="Compartir en X">X</a>
                    <a class="social-link social-linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" aria-label="Compartir en LinkedIn">in</a>
                    <a class="social-link social-whatsapp" href="https://wa.me/?text=${encodeURIComponent(article.title + ' - ' + article.subtitle + (shareTags ? ' ' + shareTags : '') + ' ' + window.location.origin + '/api/article-preview?id=' + encodeURIComponent(article.id) + '&v=' + encodeURIComponent(article.updated_at || article.date || Date.now()))}" aria-label="Compartir por WhatsApp">wa</a>
                </div>
                <div class="article-body">
                    ${formatArticleContent(article.content)}
                </div>
                <aside class="article-ad" aria-label="Publicidad de muestra">
                    <a href="https://www.macro.com.ar/" rel="noopener">
                        <img src="https://www.macro.com.ar/imagen/macrologoheader2025/logo_macro_2025.png" alt="Banco Macro">
                    </a>
                </aside>
                <section class="comments-section" aria-labelledby="comments-title">
                    <h2 id="comments-title">Comentarios</h2>
                    <form class="comment-form" id="comment-form">
                        <input id="comment-name" type="text" placeholder="Tu nombre" maxlength="80" required>
                        <input id="comment-email" type="email" placeholder="Tu correo (opcional)" maxlength="160">
                        <textarea id="comment-body" placeholder="Escribí tu comentario" maxlength="2000" required></textarea>
                        <button class="comment-submit" type="submit">Enviar comentario</button>
                        <p class="comment-status" id="comment-status">Tu comentario quedará pendiente de moderación.</p>
                    </form>
                    <div id="comments-list"></div>
                </section>
            `;
            supabaseClient.from('page_views').insert({ article_id: article.id });
            loadComments(article.id);
            document.getElementById('comment-form').addEventListener('submit', async event => {
                event.preventDefault();
                const status = document.getElementById('comment-status');
                const { error } = await supabaseClient.from('comments').insert({
                    article_id: article.id,
                    name: document.getElementById('comment-name').value.trim(),
                    email: document.getElementById('comment-email').value.trim(),
                    body: document.getElementById('comment-body').value.trim()
                });
                status.textContent = error ? 'No se pudo enviar el comentario.' : 'Comentario enviado. Aparecerá cuando sea aprobado.';
                if (!error) event.target.reset();
            });
        }

        renderArticle();
    </script>
</body>
</html>
