<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Contexto Político | Artículo</title>    <link rel="preconnect" href="https://fonts.googleapis.com">    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">    <style>        :root {            --guardian-navy: #052962;            --guardian-blue: #005689;            --guardian-accent: #00b2ff;            --guardian-yellow: #ffe500;            --guardian-red: #c70000;            --guardian-dark: #121212;            --guardian-bg: #f6f6f6;            --guardian-line: #dcdcdc;            --blanco: #ffffff;            --fuente-titulo: 'Merriweather', Georgia, serif;            --fuente-sans: 'Public Sans', -apple-system, sans-serif;        }        * { box-sizing: border-box; margin: 0; padding: 0; }        body { font-family: var(--fuente-sans); background-color: var(--guardian-bg); color: var(--guardian-dark); line-height: 1.6; }        a { text-decoration: none; color: inherit; }        img { max-width: 100%; height: auto; display: block; }        .container { max-width: 740px; margin: 0 auto; padding: 0 20px; }        header { background-color: var(--guardian-navy); color: var(--blanco); border-bottom: 3px solid var(--guardian-yellow); }        .header-main { padding: 20px 0; display: flex; justify-content: space-between; align-items: center; }        .site-title { font-family: var(--fuente-titulo); font-size: 2rem; font-weight: 900; color: var(--blanco); }        .site-title span { color: var(--guardian-accent); }        .back-link { color: var(--guardian-yellow); font-weight: 700; font-size: 0.9rem; border: 1px solid var(--guardian-yellow); padding: 6px 14px; border-radius: 2px; }        .back-link:hover { background: var(--guardian-yellow); color: var(--guardian-navy); }        .article-header { margin: 40px 0 20px; }        .article-kicker { color: var(--guardian-red); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px; display: block; }        .article-title { font-family: var(--fuente-titulo); font-size: 2.4rem; font-weight: 900; line-height: 1.1; color: var(--guardian-navy); margin-bottom: 15px; }        .article-subtitle { font-size: 1.15rem; color: #444; line-height: 1.4; margin-bottom: 20px; font-weight: 400; }        .article-meta { font-size: 0.85rem; color: #666; border-bottom: 1px solid var(--guardian-line); padding-bottom: 15px; margin-bottom: 25px; }        .article-meta strong { color: var(--guardian-dark); }        .article-figure { margin: 0 0 30px; }        .article-figure img { width: 100%; border-radius: 2px; }        .article-figure figcaption { font-size: 0.8rem; color: #555; padding-top: 8px; border-top: 2px solid var(--guardian-blue); margin-top: 8px; }        .article-body { font-family: var(--fuente-titulo); font-size: 1.1rem; line-height: 1.8; color: #222; }        .article-body p { margin-bottom: 1.2em; }        .article-body h3 { font-family: var(--fuente-sans); font-size: 1.3rem; font-weight: 800; margin: 1.5em 0 0.6em; color: var(--guardian-navy); }        .not-found { text-align: center; padding: 100px 20px; }        .not-found h2 { font-family: var(--fuente-titulo); font-size: 2rem; color: var(--guardian-navy); margin-bottom: 15px; }        footer { background-color: var(--guardian-navy); color: var(--blanco); padding: 30px 0; margin-top: 60px; border-top: 4px solid var(--guardian-yellow); text-align: center; font-size: 0.85rem; color: #a0c4e8; }        @media (max-width: 600px) {            .article-title { font-size: 1.7rem; }            .container { padding: 0 15px; }        }    </style><base target="_blank"></head><body>    <header>        <div class="container" style="max-width: 1300px;">            <div class="header-main">                <a href="index.html" class="site-title">Contexto <span>Político</span></a>                <a href="index.html" class="back-link">← Volver al inicio</a>            </div>        </div>    </header>    <main>        <div class="container" id="article-container">            <div class="not-found"><h2>Cargando artículo...</h2></div>        </div>    </main>    <footer>        <div class="container">            © 2026 Contexto Político — Periodismo Político de Investigación        </div>    </footer>    <script>        const DATA_URL = "https://raw.githubusercontent.com/Alvarorfontana/contextos.politicos/main/data.json";        function getParam(name) {            return new URL(window.location.href).searchParams.get(name);        }        async function getArticles() {            try {                const res = await fetch(DATA_URL);                if (!res.ok) throw new Error("No se pudo cargar");                return await res.json();            } catch (e) {                console.error(e);                return [];            }        }        async function renderArticle() {            const id = getParam('id');            const container = document.getElementById('article-container');            const articles = await getArticles();            const article = articles.find(a => a.id === id);            if (!article) {                container.innerHTML = `                    <div class="not-found">                        <h2>Artículo no encontrado</h2>                        <p>La noticia que buscás no existe o fue eliminada.</p>                        <br>                        <a href="index.html" style="color: var(--guardian-blue); font-weight: 700;">Volver a la portada</a>                    </div>                `;                document.title = "No encontrado | Contexto Político";                return;            }            document.title = article.title + " | Contexto Político";            const imgBlock = article.image ? `                <figure class="article-figure">                    <img src="${article.image}" alt="${article.title}">                    <figcaption>${article.caption || 'Imagen ilustrativa del artículo.'}</figcaption>                </figure>            ` : '';            container.innerHTML = `                <div class="article-header">                    <span class="article-kicker">${article.kicker}</span>                    <h1 class="article-title">${article.title}</h1>                    <p class="article-subtitle">${article.subtitle}</p>                    <div class="article-meta">                        Por <strong>${article.author}</strong> &nbsp;|&nbsp; ${new Date(article.date).toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric'})}                    </div>                </div>                ${imgBlock}                <div class="article-body">                    ${article.content}                </div>            `;        }        renderArticle();    </script></body></html>
